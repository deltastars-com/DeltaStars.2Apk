[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION  = "10"
  NODE_OPTIONS = "--max-old-space-size=4096"
  SECRETS_SCAN_OMIT_KEYS = "VITE_MOYASAR_PUBLISHABLE_KEY,VITE_MOYASAR_API_KEY,VITE_FIREBASE_API_KEY,VITE_SUPABASE_ANON_KEY,VITE_GEMINI_API_KEY,VITE_GOOGLE_MAPS_API_KEY"
  SECRETS_SCAN_OMIT_PATHS = "assets/*,dist/assets/*,dist/*"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/otp/send"
  to   = "/.netlify/functions/otp-send"
  status = 200

[[redirects]]
  from = "/api/otp/verify"
  to   = "/.netlify/functions/otp-verify"
  status = 200

[[redirects]]
  from = "/api/otp/notify"
  to   = "/.netlify/functions/otp-notify"
  status = 200

[[redirects]]
  from = "/api/contact"
  to   = "/.netlify/functions/contact-form"
  status = 200

[[redirects]]
  from = "/api/payment/create"
  to   = "/.netlify/functions/create-payment-intent"
  status = 200

[[redirects]]
  from = "/api/payment/verify"
  to   = "/.netlify/functions/verify-payment"
  status = 200

[[redirects]]
  from = "/api/payment/cancel"
  to   = "/.netlify/functions/cancel-payment"
  status = 200

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; connect-src 'self' https: wss: *.supabase.co wss://*.supabase.co https://*.firebaseio.com wss://*.firebaseio.com https://*.googleapis.com https://api.moyasar.com https://cdn.moyasar.com https://api.authentica.sa https://*.netlify.app wss://*.netlify.app; img-src 'self' https: data: blob: https://images.unsplash.com https://lh3.googleusercontent.com; font-src 'self' https: data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https: https://fonts.googleapis.com; frame-src 'self' https: https://cdn.moyasar.com https://*.google.com;"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options            = "SAMEORIGIN"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    X-Robots-Tag               = "index, follow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

