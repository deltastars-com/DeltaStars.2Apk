    Meta-tag CSP fallback (Aug 2026 audit fix):
    The real HTTP security headers are already correctly configured in

    format — so those headers were silently never applied in production

    A <meta> CSP tag works identically on ANY static host with zero
    server-side configuration needed, so it's added here as a guaranteed
    fallback. Note: frame-ancestors, X-Frame-Options, and HSTS cannot be
    set via <meta> per the HTML spec — those three MUST still be enabled
    from the EdgeOne dashboard's custom-response-headers rule for the
    domain (see AUDIT_REPORT_2026_v2.md for the exact steps).
  -->

  <!-- Native Automated Chunk Load Error and Old Version Cache Recovery Listener -->
  <script>
    // Intercept and suppress benign sandbox environment WebSocket/Vite/Fetch errors 
    // to prevent showing scary warning drawers/overlays to the user
    window.addEventListener('error', function(e) {
      var msg = (e.message || '').toLowerCase();
      var errorSource = (e.filename || '');
      if (
        msg.includes('websocket') || 
        msg.includes('vite') || 
        msg.includes('failed to fetch') ||
        errorSource.includes('_ai_studio_iframe.js')
      ) {
        console.info('🛡️ [Delta Stars] Suppressing benign sandbox/HMR error:', e.message);
        e.stopImmediatePropagation();
        e.preventDefault();
        return true;
      }
    }, true);

    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason;
      var reasonStr = '';
      if (reason) {
        reasonStr = typeof reason === 'string' ? reason : (reason.message || reason.stack || '');
      }
      reasonStr = reasonStr.toLowerCase();
      if (
        reasonStr.includes('websocket') || 
        reasonStr.includes('failed to fetch') || 
        reasonStr.includes('vite') ||
        reasonStr.includes('closed without opened')
      ) {
        console.info('🛡️ [Delta Stars] Suppressing benign sandbox/HMR unhandled rejection:', reasonStr);
        e.stopImmediatePropagation();
        e.preventDefault();
        return true;
      }
    }, true);

    // Safe global Storage polyfill (Only applies if native localStorage throws in restricted sandboxes)
    (function() {
      var mockStoreLocal = {};
      var mockStoreSession = {};

      function createSafeStorageMock(mockStore) {
        return {
          getItem: function(key) {
            return Object.prototype.hasOwnProperty.call(mockStore, key) ? mockStore[key] : null;
          },
          setItem: function(key, value) {
            mockStore[key] = String(value);
          },
          removeItem: function(key) {
            delete mockStore[key];
          },
          clear: function() {
            for (var k in mockStore) {
              if (Object.prototype.hasOwnProperty.call(mockStore, k)) {
                delete mockStore[k];
              }
            }
          },
          key: function(index) {
            var keys = Object.keys(mockStore);
            return keys[index] || null;
          },
          get length() {
            return Object.keys(mockStore).length;
          }
        };
      }

      var safeLocal = null;
      try {
        var testKey = '__ds_storage_test__';
        window.localStorage.setItem(testKey, 'ok');
        window.localStorage.removeItem(testKey);
        safeLocal = window.localStorage;
      } catch (e) {
        console.warn('⚠️ [Delta Stars Sandbox] LocalStorage restricted. Applying virtual storage.');
        safeLocal = createSafeStorageMock(mockStoreLocal);
      }

      var safeSession = null;
      try {
        var testKey = '__ds_session_test__';
        window.sessionStorage.setItem(testKey, 'ok');
        window.sessionStorage.removeItem(testKey);
        safeSession = window.sessionStorage;
      } catch (e) {
        console.warn('⚠️ [Delta Stars Sandbox] SessionStorage restricted. Applying virtual storage.');
        safeSession = createSafeStorageMock(mockStoreSession);
      }

      function overrideProperty(target, propName, safeValue) {
        if (!safeValue || safeValue === target[propName]) return;
        try { delete target[propName]; } catch(err) {}
        try {
          Object.defineProperty(target, propName, {
            get: function() { return safeValue; },
            set: function() { },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try { target[propName] = safeValue; } catch(e) {}
        }
      }

      if (safeLocal !== window.localStorage) {
        overrideProperty(window, 'localStorage', safeLocal);
      }
      if (safeSession !== window.sessionStorage) {
        overrideProperty(window, 'sessionStorage', safeSession);
      }
    })();

    window.addEventListener('error', function(e) {
      const errorText = (e.message || '').toLowerCase();
      const isChunkError = errorText.includes('chunk') || 
                           errorText.includes('failed to fetch dynamically imported module') ||
                           errorText.includes('unexpected token') || 
                           (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK') && e.target.src && e.target.src.includes('.js'));
      
      if (isChunkError) {
        console.warn('⚡ [Delta Stars] Unresolvable dynamic chunk error or stale asset version detected! Flushing caches and re-initiating system bootstrap...');
        
        // Programmatically unregister all existing service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(reg) {
              reg.unregister();
            });
          });
        }
        
        // Clear all window storage caches
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) {
              caches.delete(key);
            });
          });
        }

        // Flush Local Storage state to reset stuck sessions if needed
        try {
          localStorage.removeItem('ds_current_page');
        } catch(err) {}

        // Trigger a clean force-reload bypassing the cache
        setTimeout(function() {
          window.location.reload();
        }, 400);
      }
    }, true);

    // Absolute Failsafe: Automatically dismiss the critical boot splash screen after 1.8 seconds
    // to guarantee 100% stable uptime and prevent any rendering or chunk-loading freeze on some platforms.
    setTimeout(function() {
      var splash = document.getElementById('delta-critical-boot-splash');
      if (splash) {
        console.warn('⚠️ [Delta Stars] Absolute failsafe triggered. Forcefully dismissing splash screen.');
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function() {
          try { splash.remove(); } catch (err) {
            try { splash.style.display = 'none'; } catch (e) {}
          }
        }, 500);
      }
    }, 1800);
  </script>

  <!-- High-Performance Critical Boot Splash Screen Inline Style (Anti-Rendering Deadlock) -->
  <style>

    }
    .splash-spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #FF922B;
      border-radius: 50%;
      animation: splash-spin 1s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes splash-ping {
      75%, 100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }
  </style>

  <div id="delta-critical-boot-splash">
