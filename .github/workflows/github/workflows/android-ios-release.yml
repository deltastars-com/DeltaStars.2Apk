name: Android & iOS Release (automated)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GRADLE_USER_HOME: ${{ runner.temp }}/.gradle

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install JS dependencies (fallback)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.GRADLE_USER_HOME }}
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate temporary keystore and keystore.properties for Android (temporary)
        run: |
          mkdir -p android/app
          KEYSTORE_PASSWORD=android
          KEY_PASSWORD=android
          KEY_ALIAS=upload
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          keytool -genkeypair -v -storepass $KEYSTORE_PASSWORD -keypass $KEY_PASSWORD -keystore android/app/my-release-key.jks -alias $KEY_ALIAS -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CI, OU=CI, O=CI, L=City, S=State, C=US"
          cat > android/keystore.properties <<EOF
          storeFile=app/my-release-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Build Android release (Gradle)
        working-directory: android
        run: |
          set -e
          ./gradlew clean assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: List built APKs
        run: ls -R android/app/build/outputs || true

      - name: Create GitHub Release and upload APK(s)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: macos-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            macos-node-

      - name: Install JS dependencies (fallback)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -v 1.14.0 || true
          cd ios || exit 0
          pod install --repo-update
        working-directory: .

      - name: Check iOS signing secrets
        id: check_ios
        run: |
          if [ -z "${{ secrets.IOS_CERT_P12 }}" ] || [ -z "${{ secrets.IOS_CERT_PASSWORD }}" ] || [ -z "${{ secrets.IOS_PROVISIONING_PROFILE }}" ] || [ -z "${{ secrets.IOS_SCHEME }}" ]; then
            echo "ios_available=false" >> $GITHUB_OUTPUT
          else
            echo "ios_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Build iOS for Simulator (fallback)
        if: steps.check_ios.outputs.ios_available == 'false'
        run: |
          echo "iOS signing secrets not provided; building for simulator only (not a device-installable IPA)."
          npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output ios/main.jsbundle || true
          xcodebuild -workspace ios/*.xcworkspace -scheme ${{ secrets.IOS_SCHEME }} -configuration Debug -sdk iphonesimulator -derivedDataPath build

      - name: Prepare iOS signing (certificate + provisioning)
        if: steps.check_ios.outputs.ios_available == 'true'
        run: |
          set -e
          echo "Decoding certificate and provisioning profile"
          echo "${{ secrets.IOS_CERT_P12 }}" | base64 --decode > /tmp/ci_cert.p12
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode > /tmp/ci_profile.mobileprovision
          security create-keychain -p "" build-keychain
          security import /tmp/ci_cert.p12 -k ~/Library/Keychains/build-keychain.keychain -P "${{ secrets.IOS_CERT_PASSWORD }}" -T /usr/bin/codesign || true
          security list-keychains -s ~/Library/Keychains/build-keychain.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/ci_profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/ci_profile.mobileprovision

      - name: Archive and export IPA
        if: steps.check_ios.outputs.ios_available == 'true'
        env:
          IOS_SCHEME: ${{ secrets.IOS_SCHEME }}
          IOS_WORKSPACE: ${{ secrets.IOS_WORKSPACE }}
          IOS_PROJECT: ${{ secrets.IOS_PROJECT }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}
        run: |
          set -e
          # try workspace first (Cocoapods), else project
          if [ -n "$IOS_WORKSPACE" ] && [ -f ios/$IOS_WORKSPACE ]; then
            WORKSPACE_ARG="-workspace ios/$IOS_WORKSPACE"
          else
            WORKSPACE_ARG=""
          fi
          # Derived data
          DERIVED=build/ios/derived
          mkdir -p $DERIVED
          xcodebuild clean $WORKSPACE_ARG -scheme "$IOS_SCHEME" -configuration Release -derivedDataPath $DERIVED || true
          ARCHIVE_PATH="$DERIVED/$IOS_SCHEME.xcarchive"
          if [ -n "$WORKSPACE_ARG" ]; then
            xcodebuild archive $WORKSPACE_ARG -scheme "$IOS_SCHEME" -configuration Release -archivePath "$ARCHIVE_PATH" || exit 1
          else
            xcodebuild -project "ios/${IOS_PROJECT}" -scheme "$IOS_SCHEME" -configuration Release -archivePath "$ARCHIVE_PATH" archive || exit 1
          fi
          EXPORT_OPTIONS_PLIST="$DERIVED/exportOptions.plist"
          cat > $EXPORT_OPTIONS_PLIST <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ secrets.IOS_EXPORT_METHOD }}</string>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath "$DERIVED/export" -exportOptionsPlist $EXPORT_OPTIONS_PLIST || exit 1
          echo "IPA exported to $DERIVED/export"

      - name: Upload iOS IPA to Release
        if: steps.check_ios.outputs.ios_available == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: build/ios/derived/export/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note about iOS
        if: steps.check_ios.outputs.ios_available == 'false'
        run: |
          echo "To get an installable iOS IPA you must provide signing secrets: IOS_CERT_P12 (base64), IOS_CERT_PASSWORD, IOS_PROVISIONING_PROFILE (base64), IOS_SCHEME, and IOS_EXPORT_METHOD (app-store/ad-hoc/development/enterprise)."
